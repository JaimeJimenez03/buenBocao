<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Fuego Lento · Admin Login</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1B5E20 0%, #2E7D32 50%, #60AD5E 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: #fff;
            border-radius: 20px;
            padding: 40px 36px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-circle {
            width: 64px;
            height: 64px;
            background: #E8F5E9;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .logo-circle svg {
            width: 32px;
            height: 32px;
            stroke: #2E7D32;
        }

        .logo h1 {
            font-size: 22px;
            font-weight: 700;
            color: #1A1A1A;
            letter-spacing: 0.5px;
        }

        .logo p {
            font-size: 13px;
            color: #6B6B6B;
            margin-top: 2px;
        }

        .error-box {
            background: #FFEBEE;
            border: 1px solid #FFCDD2;
            color: #C62828;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #444;
            margin-bottom: 5px;
        }

        .field {
            margin-bottom: 16px;
        }

        input[type=text],
        input[type=password] {
            width: 100%;
            height: 46px;
            border: 1.5px solid #E0E0E0;
            border-radius: 10px;
            padding: 0 14px;
            font-size: 14px;
            color: #1A1A1A;
            outline: none;
            transition: border-color .2s;
        }

        input:focus {
            border-color: #2E7D32;
        }

        button[type=submit] {
            width: 100%;
            height: 48px;
            background: #2E7D32;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            transition: background .2s;
        }

        button[type=submit]:hover {
            background: #1B5E20;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #9E9E9E;
            margin-top: 24px;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="logo">
            <div class="logo-circle">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z" />
                    <line x1="6" y1="17" x2="18" y2="17" />
                    <line x1="6" y1="21" x2="18" y2="21" />
                </svg>
            </div>
            <h1>A Fuego Lento</h1>
            <p>Panel de Administración</p>
        </div>

        <div class="error-box" th:if="${error}" th:text="${error}"></div>

        <form method="post" th:action="@{/adminControlPanel/login}">
            <div class="field">
                <label for="username">Usuario</label>
                <input id="username" type="text" name="username" placeholder="Tu usuario admin" required autofocus />
            </div>
            <div class="field">
                <label for="password">Contraseña</label>
                <input id="password" type="password" name="password" placeholder="••••••••" required />
            </div>
            <button type="submit">Entrar al panel</button>
        </form>

        <div class="footer">Solo accesible para administradores</div>
    </div>
</body>

</html>
