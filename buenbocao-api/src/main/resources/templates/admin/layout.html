<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:replace="${title}">Admin</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --green-dark: #1B5E20;
            --green-main: #2E7D32;
            --green-light: #60AD5E;
            --green-pale: #E8F5E9;
            --green-border: #C8E6C9;
            --bg: #F3EDE3;
            --surface: #FFFFFF;
            --border: #E8E3DC;
            --text: #1A1A1A;
            --text-muted: #6B6B6B;
            --yellow-bg: #FFF8E1;
            --yellow-text: #E65100;
            --yellow-border: #FFE082;
            --red-bg: #FFEBEE;
            --red-text: #C62828;
            --red-border: #FFCDD2;
            --blue-bg: #E3F2FD;
            --blue-text: #1565C0;
            --sidebar-w: 220px;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ── Topbar ── */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 52px;
            z-index: 100;
            background: var(--green-dark);
            color: #fff;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 16px;
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 700;
            width: var(--sidebar-w);
        }

        .topbar-brand svg {
            width: 22px;
            height: 22px;
            stroke: #fff;
            flex-shrink: 0;
        }

        .topbar-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 13px;
        }

        .topbar-right span {
            color: #A5D6A7;
        }

        .btn-logout {
            background: rgba(255, 255, 255, .15);
            border: 1px solid rgba(255, 255, 255, .3);
            color: #fff;
            padding: 5px 12px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-logout:hover {
            background: rgba(255, 255, 255, .25);
        }

        /* ── Sidebar ── */
        .sidebar {
            position: fixed;
            top: 52px;
            left: 0;
            bottom: 0;
            width: var(--sidebar-w);
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 16px 0;
            overflow-y: auto;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            font-size: 14px;
            color: var(--text-muted);
            text-decoration: none;
            transition: all .15s;
        }

        .nav-item svg {
            width: 17px;
            height: 17px;
            stroke: currentColor;
            flex-shrink: 0;
        }

        .nav-item:hover {
            background: var(--green-pale);
            color: var(--green-main);
        }

        .nav-item.active {
            background: var(--green-pale);
            color: var(--green-main);
            font-weight: 600;
            border-right: 3px solid var(--green-main);
        }

        .nav-section {
            font-size: 10px;
            font-weight: 700;
            color: #B0BEC5;
            text-transform: uppercase;
            letter-spacing: .8px;
            padding: 14px 18px 4px;
        }

        /* ── Main ── */
        .main {
            margin-left: var(--sidebar-w);
            margin-top: 52px;
            padding: 28px 28px;
            flex: 1;
        }

        .page-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
        }

        .page-sub {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        /* ── Cards ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 14px;
            color: var(--text);
        }

        /* ── Stats grid ── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 18px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--green-main);
        }

        .stat-value.red {
            color: var(--red-text);
        }

        .stat-value.yellow {
            color: #F57F17;
        }

        /* ── Table ── */
        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead th {
            background: #F9F6F1;
            padding: 10px 12px;
            text-align: left;
            font-weight: 600;
            font-size: 12px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        tbody td {
            padding: 10px 12px;
            border-bottom: 1px solid #F0ECE6;
            vertical-align: middle;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background: #FAFAF8;
        }

        /* ── Badges ── */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 9px;
            border-radius: 99px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }

        .badge-pending {
            background: var(--yellow-bg);
            color: var(--yellow-text);
            border: 1px solid var(--yellow-border);
        }

        .badge-reviewing {
            background: var(--blue-bg);
            color: var(--blue-text);
            border: 1px solid #90CAF9;
        }

        .badge-resolved {
            background: var(--green-pale);
            color: var(--green-main);
            border: 1px solid var(--green-border);
        }

        .badge-dismissed {
            background: #F5F5F5;
            color: #757575;
            border: 1px solid #E0E0E0;
        }

        .badge-user {
            background: #F3E5F5;
            color: #7B1FA2;
            border: 1px solid #CE93D8;
        }

        .badge-recipe {
            background: var(--blue-bg);
            color: var(--blue-text);
            border: 1px solid #90CAF9;
        }

        .badge-review {
            background: #FFF3E0;
            color: #E65100;
            border: 1px solid var(--yellow-border);
        }

        .badge-banned {
            background: var(--red-bg);
            color: var(--red-text);
            border: 1px solid var(--red-border);
        }

        .badge-active {
            background: var(--green-pale);
            color: var(--green-main);
            border: 1px solid var(--green-border);
        }

        /* ── Buttons ── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            text-decoration: none;
            transition: all .15s;
        }

        .btn svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
        }

        .btn-primary {
            background: var(--green-main);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--green-dark);
        }

        .btn-danger {
            background: var(--red-bg);
            color: var(--red-text);
            border: 1px solid var(--red-border);
        }

        .btn-danger:hover {
            background: #FFCDD2;
        }

        .btn-warning {
            background: var(--yellow-bg);
            color: var(--yellow-text);
            border: 1px solid var(--yellow-border);
        }

        .btn-warning:hover {
            background: #FFE082;
        }

        .btn-secondary {
            background: #fff;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: #F5F5F5;
        }

        .btn-sm {
            padding: 4px 10px;
            font-size: 12px;
        }

        /* ── Alerts ── */
        .alert {
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .alert-success {
            background: var(--green-pale);
            color: var(--green-main);
            border: 1px solid var(--green-border);
        }

        .alert-error {
            background: var(--red-bg);
            color: var(--red-text);
            border: 1px solid var(--red-border);
        }

        /* ── Forms ── */
        .form-group {
            margin-bottom: 14px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .form-control {
            width: 100%;
            height: 38px;
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 0 12px;
            font-size: 13px;
            color: var(--text);
            background: #FAFAFA;
            outline: none;
            transition: border-color .2s;
        }

        .form-control:focus {
            border-color: var(--green-main);
            background: #fff;
        }

        select.form-control {
            cursor: pointer;
        }

        textarea.form-control {
            height: auto;
            padding: 10px 12px;
            resize: vertical;
        }

        /* ── Pagination ── */
        .pagination {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-top: 16px;
        }

        .page-btn {
            padding: 5px 11px;
            border: 1px solid var(--border);
            border-radius: 7px;
            font-size: 13px;
            color: var(--text-muted);
            background: var(--surface);
            text-decoration: none;
        }

        .page-btn:hover {
            background: var(--green-pale);
            color: var(--green-main);
        }

        .page-btn.active {
            background: var(--green-main);
            color: #fff;
            border-color: var(--green-main);
        }

        .page-btn.disabled {
            opacity: .4;
            pointer-events: none;
        }

        /* ── Misc ── */
        .text-muted {
            color: var(--text-muted);
        }

        .flex-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 16px 0;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot-pending {
            background: #F9A825;
        }

        .dot-reviewing {
            background: #1976D2;
        }

        .dot-resolved {
            background: var(--green-main);
        }

        .dot-dismissed {
            background: #9E9E9E;
        }
    </style>
</head>

<body>

    <!-- Topbar -->
    <div class="topbar">
        <div class="topbar-brand">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path
                    d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z" />
                <line x1="6" y1="17" x2="18" y2="17" />
                <line x1="6" y1="21" x2="18" y2="21" />
            </svg>
            A Fuego Lento Admin
        </div>
        <div class="topbar-right">
            <span th:text="'@' + ${adminUsername}"></span>
            <form method="post" th:action="@{/adminControlPanel/logout}" style="margin:0;">
                <button class="btn-logout" type="submit">Cerrar sesión</button>
            </form>
        </div>
    </div>

    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="nav-section">General</div>
        <a th:href="@{/adminControlPanel}" th:classappend="${activePage == 'dashboard'} ? 'active'" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                <rect x="3" y="3" width="7" height="7" />
                <rect x="14" y="3" width="7" height="7" />
                <rect x="3" y="14" width="7" height="7" />
                <rect x="14" y="14" width="7" height="7" />
            </svg>
            Dashboard
        </a>

        <div class="nav-section">Moderación</div>
        <a th:href="@{/adminControlPanel/reports}" th:classappend="${activePage == 'reports'} ? 'active'"
            class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <polyline points="14 2 14 8 20 8" />
                <line x1="16" y1="13" x2="8" y2="13" />
                <line x1="16" y1="17" x2="8" y2="17" />
            </svg>
            Reportes
        </a>
        <a th:href="@{/adminControlPanel/my-queue}" th:classappend="${activePage == 'my-queue'} ? 'active'"
            class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <line x1="16" y1="2" x2="16" y2="6" />
                <line x1="8" y1="2" x2="8" y2="6" />
                <line x1="3" y1="10" x2="21" y2="10" />
                <path d="M8 14l2 2 4-4" />
            </svg>
            Mis revisiones
            <span th:if="${myQueueCount != null and myQueueCount > 0}" th:text="${myQueueCount}"
                style="margin-left:auto; background:#1565C0; color:#fff; border-radius:99px; font-size:10px; font-weight:700; padding:1px 6px; min-width:18px; text-align:center;"></span>
        </a>

        <div class="nav-section">Usuarios</div>
        <a th:href="@{/adminControlPanel/users}" th:classappend="${activePage == 'users'} ? 'active'" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
            Usuarios
        </a>
        <a th:href="@{/adminControlPanel/users(filter='banned')}" th:classappend="${activePage == 'banned'} ? 'active'"
            class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                <circle cx="12" cy="12" r="10" />
                <line x1="4.93" y1="4.93" x2="19.07" y2="19.07" />
            </svg>
            Usuarios baneados
        </a>

        <div class="nav-section">Contenido</div>
        <a th:href="@{/adminControlPanel/recipes}" th:classappend="${activePage == 'recipes'} ? 'active'"
            class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                <path
                    d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z" />
                <line x1="6" y1="17" x2="18" y2="17" />
                <line x1="6" y1="21" x2="18" y2="21" />
            </svg>
            Recetas
        </a>
        <a th:href="@{/adminControlPanel/events}" th:classappend="${activePage == 'events'} ? 'active'"
            class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <line x1="16" y1="2" x2="16" y2="6" />
                <line x1="8" y1="2" x2="8" y2="6" />
                <line x1="3" y1="10" x2="21" y2="10" />
            </svg>
            Eventos
        </a>

        <div class="nav-section">Negocio</div>
        <a th:href="@{/adminControlPanel/subscriptions}" th:classappend="${activePage == 'subscriptions'} ? 'active'"
            class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                <rect x="1" y="4" width="22" height="16" rx="2" />
                <line x1="1" y1="10" x2="23" y2="10" />
            </svg>
            Suscripciones
        </a>

        <div class="nav-section">Sistema</div>
        <a th:href="@{/swagger-ui/index.html}" target="_blank" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
            Swagger UI ↗
        </a>
    </nav>

    <!-- Main content -->
    <div class="main">
        <th:block th:insert="${content}" />
    </div>

</body>

</html>
