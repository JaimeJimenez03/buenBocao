<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f5f5f5; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 40px; }
        .logo { text-align: center; font-size: 28px; font-weight: bold; color: #e85d2a; margin-bottom: 30px; }
        h1 { font-size: 22px; color: #333; margin-bottom: 10px; }
        p { color: #555; line-height: 1.6; font-size: 15px; }
        .warning { background-color: #fff3cd; border-left: 4px solid #ffc107; padding: 12px 16px; border-radius: 4px; margin: 20px 0; }
        .footer { text-align: center; color: #999; font-size: 12px; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🍽 Buen Bocao</div>
        <h1>Contraseña actualizada</h1>
        <p>Hola, <strong th:text="${username}">usuario</strong>.</p>
        <p>Tu contraseña ha sido cambiada correctamente.</p>
        <div class="warning">
            <p style="margin: 0;">⚠️ Si no has sido tú, contacta con soporte inmediatamente.</p>
        </div>
        <div class="footer">
            <p>© 2026 Buen Bocao — La red social de recetas</p>
        </div>
    </div>
</body>
</html>
