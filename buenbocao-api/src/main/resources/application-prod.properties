# ========================================
#   PERFIL PRODUCCIÓN (prod)
# ========================================
# Activar con: spring.profiles.active=prod

# Solo validar esquema, NO tocar la BD
spring.jpa.hibernate.ddl-auto=validate

# Sin SQL en logs
spring.jpa.show-sql=false

# No ejecutar scripts de init
spring.sql.init.mode=never

# Logging mínimo en producción
logging.level.com.buenbocao.api=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
logging.level.root=WARN

# Swagger DESHABILITADO en producción
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# CORS — sustituir por los dominios reales de producción
# app.cors.allowed-origins=https://buenbocao.com,https://www.buenbocao.com
