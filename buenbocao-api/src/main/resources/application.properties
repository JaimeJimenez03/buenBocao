# ========================================
#   BUEN BOCAO API - Configuración Base
#   Las variables ${XXX} se leen del .env
# ========================================

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---- Servidor ----
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api/v1


# ---- Base de datos (MySQL) ----
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://194.164.167.19:3306/buenBocao?serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ---- SQL Init ----
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# ---- Jackson ----
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- Multipart (subida de archivos) ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

# ---- JWT ----
security.jwt.secret-key=${SECURITY_JWT_SECRET_KEY}
security.jwt.expiration-time=${SECURITY_JWT_EXPIRATION_TIME:3600000}
security.jwt.refresh-expiration-time=604800000

# ---- Storage ----
app.storage.upload-dir=${UPLOAD_DIR:./uploads}
app.storage.max-file-size=52428800

# ---- Email (SMTP) ----
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from-name=Buen Bocao
app.mail.from-address=${SPRING_MAIL_USERNAME:noreply@buenbocao.com}


# ---- Stripe ----

stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

stripe.price-id.monthly=price_1Tc46G3YxWoWXb25bDYe97ex
stripe.price-id.annual=price_1Tc46G3YxWoWXb25ozsJ6dQt
stripe.currency=eur
stripe.statement-descriptor=Buen Bocao Premium

# ---- App ----
app.base-url=${APP_BASE_URL:http://194.164.167.19:${SERVER_PORT:8080}/api/v1}

app.version.min-android=${APP_VERSION_MIN_ANDROID:1.0.0}
app.version.min-ios=${APP_VERSION_MIN_IOS:1.0.0}

app.maintenance=${APP_MAINTENANCE:false}
app.maintenance.message=${APP_MAINTENANCE_MESSAGE:En mantenimiento}

# ---- Swagger / OpenAPI ----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ---- CORS ----
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:[*],http://192.168.*.[*]:[*],exp://192.168.*.[*]:[*]}

# ---- Logging ----
logging.level.root=INFO
logging.level.com.buenbocao.api=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.orm.jdbc.bind=WARN
